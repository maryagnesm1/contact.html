<section class="split">
  <div class="left-video">
    <video autoplay muted loop playsinline
           poster="media/vermeerladywriting.jpg"
           aria-label="Image of a painting that shows a woman writing with a feathered quill pen">
      <source src="media/vermeerladywriting.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <main class="contact-wrapper">
    <h1>Send us a message</h1>

    <p class="intro">
      Feel free to complete contact form for more information about A Time Traveler's Journey
    </p>

    <form action="https://formspree.io/f/xgodvgdk" method="POST">

      <input type="hidden" name="_subject" value="New message from Mary's Contact Page">

      <label>Name:</label>
      <input type="text" name="name" required>

      <label>Email:</label>
      <input type="email" name="email" required>

      <label>Subject:</label>
      <input type="text" name="subject" required>

      <label>Message:</label>
      <textarea name="message" rows="5" required></textarea>

      <button type="submit">Submit Form</button>

    </form>
  </main>

</section>
